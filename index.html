<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12385b">
  <title>化学能力诊断｜酸碱盐基础 × 周期律同步训练</title>
  <style>
    :root {
      --navy: #12385b;
      --navy-2: #1b4b72;
      --teal: #16867d;
      --teal-soft: #e7f5f2;
      --ink: #183042;
      --muted: #607381;
      --line: #dce5e9;
      --paper: #ffffff;
      --bg: #f4f7f8;
      --ok: #16835b;
      --ok-bg: #e8f6ef;
      --bad: #b44444;
      --bad-bg: #fbeeee;
      --shadow: 0 14px 40px rgba(23, 55, 75, .08);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 2%, rgba(22, 134, 125, .08), transparent 28rem),
        linear-gradient(180deg, #f8fafb 0, var(--bg) 45%);
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(100% - 32px, 920px); margin: 0 auto; padding: 28px 0 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 11px; color: var(--navy); font-weight: 750; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: white; background: var(--navy); font-size: 20px; }
    .top-meta { color: var(--muted); font-size: 13px; }
    .screen { display: none; animation: reveal .25s ease-out; }
    .screen.active { display: block; }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .panel { background: rgba(255,255,255,.96); border: 1px solid rgba(220,229,233,.9); border-radius: var(--radius); box-shadow: var(--shadow); }
    .hero { display: grid; grid-template-columns: 1.2fr .8fr; overflow: hidden; }
    .hero-copy { padding: 52px 48px; }
    .eyebrow { margin: 0 0 15px; color: var(--teal); font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 14px; color: var(--navy); font-size: clamp(34px, 6vw, 54px); line-height: 1.08; letter-spacing: -.045em; }
    .lead { margin-bottom: 34px; color: var(--muted); font-size: 17px; line-height: 1.7; }
    .hero-side { display: flex; flex-direction: column; justify-content: center; padding: 42px; background: var(--navy); color: white; }
    .hero-side .mini { color: #a9cfca; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    .route { display: grid; gap: 16px; margin-top: 25px; }
    .route-row { display: flex; gap: 14px; align-items: center; color: #eaf2f7; font-size: 14px; }
    .route-num { display: grid; place-items: center; flex: 0 0 30px; height: 30px; border: 1px solid rgba(255,255,255,.28); border-radius: 50%; color: #9fd7cf; font-weight: 800; }
    .field-label { display: block; margin: 0 0 9px; color: var(--navy); font-size: 14px; font-weight: 750; }
    .name-input { width: 100%; height: 52px; padding: 0 15px; border: 1px solid #cddadd; border-radius: 12px; outline: 0; color: var(--ink); background: white; transition: .2s; }
    .name-input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(22,134,125,.1); }
    .profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0 26px; }
    .profile { position: relative; cursor: pointer; }
    .profile input { position: absolute; opacity: 0; pointer-events: none; }
    .profile-card { display: block; min-height: 86px; padding: 16px; border: 1px solid #d7e1e5; border-radius: 14px; background: #fafcfc; transition: .2s; }
    .profile-card strong { display: block; margin-bottom: 5px; color: var(--navy); }
    .profile-card small { color: var(--muted); line-height: 1.45; }
    .profile input:checked + .profile-card { border-color: var(--teal); background: var(--teal-soft); box-shadow: inset 0 0 0 1px var(--teal); }
    .primary, .secondary, .text-button { border: 0; cursor: pointer; }
    .primary { min-height: 50px; padding: 0 24px; border-radius: 12px; color: white; background: var(--teal); font-weight: 750; box-shadow: 0 7px 18px rgba(22,134,125,.18); }
    .primary:hover { background: #11776f; }
    .primary:disabled { cursor: not-allowed; opacity: .45; box-shadow: none; }
    .secondary { min-height: 46px; padding: 0 20px; border-radius: 12px; color: var(--navy); background: #edf3f5; font-weight: 700; }
    .wide { width: 100%; }
    .error { min-height: 20px; margin-top: 10px; color: var(--bad); font-size: 13px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .section-head h2 { margin-bottom: 7px; color: var(--navy); font-size: clamp(25px, 4vw, 36px); letter-spacing: -.03em; }
    .section-head p { margin-bottom: 0; color: var(--muted); }
    .progress-wrap { min-width: 180px; text-align: right; }
    .progress-label { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #dfe8eb; }
    .progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--teal); transition: width .25s; }
    .study-card { min-height: 375px; padding: clamp(28px, 7vw, 60px); display: flex; flex-direction: column; justify-content: center; }
    .card-index { color: var(--teal); font-size: 13px; font-weight: 800; letter-spacing: .12em; }
    .study-card h3 { margin: 12px 0 35px; color: var(--navy); font-size: clamp(24px, 5vw, 38px); }
    .concept-flow { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 17px; color: var(--navy); font-size: clamp(19px, 4vw, 29px); font-weight: 780; text-align: center; }
    .concept-flow .node { padding: 13px 18px; border-radius: 12px; background: #f0f5f6; }
    .arrow { color: var(--teal); font-size: 28px; }
    .chem { white-space: nowrap; font-family: "Times New Roman", "Noto Serif SC", serif; font-weight: 700; }
    sub { font-size: .7em; vertical-align: -.22em; }
    sup { font-size: .68em; vertical-align: .52em; }
    .ion-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .ion-chip { padding: 17px 8px; border: 1px solid var(--line); border-radius: 13px; color: var(--navy); background: #f9fbfb; text-align: center; font-size: 22px; }
    .card-note { margin: 28px 0 0; color: var(--muted); text-align: center; line-height: 1.7; }
    .card-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .quiz-card { padding: clamp(24px, 5vw, 46px); }
    .quiz-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 25px; }
    .tag { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 99px; color: var(--teal); background: var(--teal-soft); font-size: 12px; font-weight: 750; }
    .q-count { color: var(--muted); font-size: 13px; }
    .question { min-height: 68px; margin-bottom: 24px; color: var(--navy); font-size: clamp(20px, 4vw, 27px); line-height: 1.55; font-weight: 750; }
    .options { display: grid; gap: 11px; }
    .option { position: relative; display: flex; align-items: center; min-height: 57px; padding: 13px 16px 13px 50px; border: 1px solid #d7e1e5; border-radius: 13px; cursor: pointer; background: #fff; line-height: 1.5; transition: .16s; }
    .option:hover { border-color: #a9c5c4; background: #fbfdfd; }
    .option input { position: absolute; opacity: 0; }
    .option::before { content: ""; position: absolute; left: 17px; width: 18px; height: 18px; border: 2px solid #b8c7cc; border-radius: 50%; }
    .option.selected { border-color: var(--teal); background: var(--teal-soft); }
    .option.selected::before { border: 5px solid var(--teal); }
    .option.correct { border-color: var(--ok); background: var(--ok-bg); }
    .option.wrong { border-color: var(--bad); background: var(--bad-bg); }
    .feedback { display: none; margin-top: 18px; padding: 17px 18px; border-radius: 13px; line-height: 1.65; }
    .feedback.show { display: block; }
    .feedback.ok { color: #105c42; background: var(--ok-bg); }
    .feedback.bad { color: #793434; background: var(--bad-bg); }
    .feedback strong { display: block; margin-bottom: 3px; }
    .quiz-actions { display: flex; justify-content: flex-end; margin-top: 22px; }
    .report-hero { display: grid; grid-template-columns: 1fr auto; gap: 26px; align-items: center; padding: clamp(26px, 5vw, 46px); background: var(--navy); color: white; }
    .report-hero h2 { margin: 7px 0 8px; font-size: clamp(27px, 5vw, 40px); }
    .report-hero p { margin: 0; color: #bcd0dd; }
    .score-ring { display: grid; place-items: center; width: 116px; height: 116px; border: 8px solid rgba(255,255,255,.15); border-top-color: #6fd0c3; border-radius: 50%; text-align: center; }
    .score-ring strong { display: block; font-size: 31px; line-height: 1; }
    .score-ring small { color: #c6d8e2; }
    .tabs { display: flex; gap: 6px; margin: 20px 0; padding: 5px; width: fit-content; border-radius: 12px; background: #e7eef1; }
    .tab { min-height: 38px; padding: 0 17px; border: 0; border-radius: 9px; cursor: pointer; color: var(--muted); background: transparent; font-weight: 700; }
    .tab.active { color: var(--navy); background: white; box-shadow: 0 2px 8px rgba(20,50,70,.08); }
    .report-view { display: none; }
    .report-view.active { display: block; }
    .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .report-card { padding: 25px; }
    .report-card h3 { margin-bottom: 18px; color: var(--navy); font-size: 18px; }
    .skill-list { display: grid; gap: 14px; }
    .skill-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .stars { color: #cbd7db; letter-spacing: 2px; }
    .stars .on { color: #e49d35; }
    .advice { margin: 0; padding: 17px 18px; border-left: 4px solid var(--teal); border-radius: 5px 12px 12px 5px; color: #285064; background: var(--teal-soft); line-height: 1.7; }
    .weak-list { margin: 0; padding-left: 21px; color: #385262; line-height: 1.8; }
    .weak-list li + li { margin-top: 8px; }
    .teacher-banner { margin-bottom: 18px; padding: 18px 22px; border-radius: 14px; color: #24485b; background: #e8f1f4; line-height: 1.65; }
    .details { margin-top: 18px; }
    details { border-top: 1px solid var(--line); }
    summary { padding: 17px 2px; cursor: pointer; color: var(--navy); font-weight: 700; }
    .mistake { margin: 0 0 13px; padding: 15px; border-radius: 12px; background: #faf4f4; color: #684343; line-height: 1.65; }
    .mistake small { display: block; margin-top: 5px; color: #8c6868; }
    .report-actions { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
    .footer-note { margin-top: 28px; color: #84949e; font-size: 12px; text-align: center; }
    .feedback-box-wrap { margin: 0 0 18px; }
    .feedback-box-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .feedback-box-head h3 { margin: 0; color: var(--navy); font-size: 18px; }
    .copy-btn { flex: 0 0 auto; min-height: 38px; padding: 0 16px; border: 0; border-radius: 9px; cursor: pointer; color: white; background: var(--navy); font-weight: 700; font-size: 13px; transition: .2s; }
    .copy-btn:hover { background: var(--navy-2); }
    .copy-btn.copied { background: var(--ok); }
    .copy-btn:disabled { cursor: default; }
    .copy-hint { min-height: 18px; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .copy-hint.ok { color: var(--ok); }
    .copy-hint.bad { color: var(--bad); }
    .feedback-box { width: 100%; min-height: 280px; max-height: 520px; overflow-y: auto; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: #f9fbfb; color: #1a3328; font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Menlo", monospace; font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 920px); padding-top: 18px; }
      .topbar { margin-bottom: 20px; }
      .top-meta { display: none; }
      .hero { grid-template-columns: 1fr; }
      .hero-copy { padding: 35px 24px 28px; }
      .hero-side { padding: 27px 24px; }
      .lead { margin-bottom: 26px; }
      .section-head { align-items: start; flex-direction: column; gap: 15px; }
      .progress-wrap { width: 100%; text-align: left; }
      .study-card { min-height: 390px; }
      .concept-flow { flex-direction: column; }
      .concept-flow .arrow { transform: rotate(90deg); }
      .ion-grid { grid-template-columns: repeat(2, 1fr); }
      .ion-chip:last-child { grid-column: 1 / -1; }
      .report-grid { grid-template-columns: 1fr; }
      .report-hero { grid-template-columns: 1fr; }
      .score-ring { width: 96px; height: 96px; }
    }
    @media (max-width: 420px) {
      .profiles { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
      .card-actions, .report-actions { flex-direction: column-reverse; }
      .card-actions button, .report-actions button { width: 100%; }
      .tabs { width: 100%; }
      .tab { flex: 1; padding: 0 8px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">⚗</span><span>化学能力诊断</span></div>
      <span class="top-meta">初三 → 高一衔接</span>
    </header>

    <section id="home" class="screen active" aria-labelledby="home-title">
      <div class="panel hero">
        <div class="hero-copy">
          <p class="eyebrow">Chemistry readiness</p>
          <h1 id="home-title">化学能力诊断</h1>
          <p class="lead">酸碱盐基础 × 周期律同步训练<br>用一次小测，找到真正需要补上的知识环节。</p>
          <form id="start-form" novalidate>
            <label class="field-label" for="student-name">姓名（必填）</label>
            <input id="student-name" class="name-input" autocomplete="name" placeholder="请输入姓名" maxlength="12">
            <label class="field-label" for="student-school" style="margin-top:14px">学校/班级（选填）</label>
            <input id="student-school" class="name-input" autocomplete="organization" placeholder="例如：XX中学初三3班" maxlength="30">
            <div class="profiles" role="radiogroup" aria-label="选择学习方案">
              <label class="profile">
                <input type="radio" name="profile" value="foundation">
                <span class="profile-card"><strong>基础强化方案</strong><small>基础巩固 40% · 课堂同步 60%</small></span>
              </label>
              <label class="profile">
                <input type="radio" name="profile" value="bridge">
                <span class="profile-card"><strong>衔接进阶方案</strong><small>基础确认 30% · 课堂同步 70%</small></span>
              </label>
            </div>
            <button class="primary wide" type="submit">开始学习</button>
            <div id="form-error" class="error" aria-live="polite"></div>
          </form>
        </div>
        <aside class="hero-side" aria-label="学习流程">
          <span class="mini">本次学习路径 · 约 6 分钟</span>
          <div class="route">
            <div class="route-row"><span class="route-num">1</span><span>1 分钟知识卡片</span></div>
            <div class="route-row"><span class="route-num">2</span><span>15 道针对性小测</span></div>
            <div class="route-row"><span class="route-num">3</span><span>获得能力诊断与补学建议</span></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="cards" class="screen" aria-labelledby="cards-title">
      <div class="section-head">
        <div><p class="eyebrow">1 MINUTE REVIEW</p><h2 id="cards-title">先搭好推理的桥</h2><p>每张卡只记住一个核心关系。</p></div>
        <div class="progress-wrap"><div id="card-progress-label" class="progress-label">1 / 6</div><div class="progress"><span id="card-progress"></span></div></div>
      </div>
      <article id="study-card" class="panel study-card"></article>
      <div class="card-actions">
        <button id="card-prev" class="secondary" type="button">上一张</button>
        <button id="card-next" class="primary" type="button">下一张</button>
      </div>
    </section>

    <section id="quiz" class="screen" aria-labelledby="quiz-title">
      <div class="section-head">
        <div><p class="eyebrow">DIAGNOSTIC QUIZ</p><h2 id="quiz-title">现在，试着自己推断</h2></div>
        <div class="progress-wrap"><div id="quiz-progress-label" class="progress-label">第 1 题，共 15 题</div><div class="progress"><span id="quiz-progress"></span></div></div>
      </div>
      <article class="panel quiz-card">
        <div class="quiz-meta"><span id="question-tag" class="tag"></span><span id="question-count" class="q-count"></span></div>
        <div id="question-text" class="question"></div>
        <div id="options" class="options" role="radiogroup"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div class="quiz-actions"><button id="quiz-action" class="primary" type="button" disabled>提交答案</button></div>
      </article>
    </section>

    <section id="report" class="screen" aria-labelledby="report-title">
      <div class="panel report-hero">
        <div><span class="eyebrow" style="color:#79d2c6">DIAGNOSIS COMPLETE</span><h2 id="report-title">诊断完成</h2><p id="report-subtitle"></p></div>
        <div class="score-ring"><div><strong id="score-number">0</strong><small>正确率</small></div></div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-report="student" role="tab" aria-selected="true">学生报告</button>
        <button class="tab" data-report="teacher" role="tab" aria-selected="false">教师报告</button>
      </div>
      <div id="student-report" class="report-view active"></div>
      <div id="teacher-report" class="report-view"></div>
      <div class="report-actions"><button id="restart" class="secondary" type="button">返回首页</button></div>
      <p class="footer-note">答题记录仅保存在当前设备的浏览器中。</p>
    </section>
  </main>

  <script>
    const cards = [
      { title: '周期和电子层', body: '<div class="concept-flow"><span class="node">周期数</span><span class="arrow">→</span><span class="node">电子层数</span></div>', note: '位于第几周期，就有几个电子层。' },
      { title: '族和最外层电子', body: '<div class="concept-flow"><span class="node">主族序数</span><span class="arrow">→</span><span class="node">最外层电子数</span></div>', note: '主族元素可由族序数判断最外层电子数。' },
      { title: '电子数决定化合价', body: '<div class="concept-flow"><span class="node">最外层电子</span><span class="arrow">→</span><span class="node">最高正价<br>最低负价</span></div>', note: '先找到最外层电子数，再判断得失电子的趋势。' },
      { title: '元素位置推碱', body: '<div class="concept-flow"><span class="node">第7周期第1族</span><span class="arrow">→</span><span class="node chem">Fr</span><span class="arrow">→</span><span class="node">+1价</span><span class="arrow">→</span><span class="node chem">FrOH</span></div>', note: '位置 → 元素 → 化合价 → 碱的化学式。' },
      { title: '常见离子', body: '<div class="ion-grid"><div class="ion-chip chem">OH<sup>−</sup></div><div class="ion-chip chem">CO<sub>3</sub><sup>2−</sup></div><div class="ion-chip chem">SO<sub>4</sub><sup>2−</sup></div><div class="ion-chip chem">NO<sub>3</sub><sup>−</sup></div><div class="ion-chip chem">NH<sub>4</sub><sup>+</sup></div></div>', note: '依次是氢氧根、碳酸根、硫酸根、硝酸根、铵根。' },
      { title: '一水合氨', body: '<div class="concept-flow"><span class="node chem">NH<sub>3</sub>·H<sub>2</sub>O</span><span class="arrow">→</span><span class="node">属于碱</span></div>', note: '原因：在水中产生氢氧根离子 OH⁻。' }
    ];

    const common = {
      q: (tag, skill, prompt, options, answer, diagnose, explain, area='同步') => ({tag, skill, prompt, options, answer, diagnose, explain, area})
    };

    const banks = {
      foundation: [
        common.q('离子识别','离子识别','<span class="chem">OH<sup>−</sup></span> 是哪一种离子？',['氢氧根离子','碳酸根离子','硝酸根离子','铵根离子'],0,'没有把离子名称与符号对应起来。','OH⁻ 是氢氧根离子，是带 1 个单位负电荷的阴离子。','基础'),
        common.q('离子识别','离子识别','碳酸根离子的符号是？',['<span class="chem">CO<sub>3</sub><sup>2−</sup></span>','<span class="chem">SO<sub>4</sub><sup>2−</sup></span>','<span class="chem">NO<sub>3</sub><sup>−</sup></span>','<span class="chem">NH<sub>4</sub><sup>+</sup></span>'],0,'碳酸根与其他常见酸根的符号发生混淆。','碳酸根是 CO₃²⁻：含 C、O 两种元素，带 2 个单位负电荷。','基础'),

        common.q('酸碱盐分类','酸碱盐分类','下列物质的分类完全正确的是？',['<span class="chem">HCl</span>—酸；<span class="chem">NaOH</span>—碱；<span class="chem">NaCl</span>—盐；<span class="chem">CaCO<sub>3</sub></span>—盐','HCl—碱；NaOH—酸；NaCl—盐；CaCO₃—盐','HCl—酸；NaOH—盐；NaCl—碱；CaCO₃—盐','HCl—盐；NaOH—碱；NaCl—酸；CaCO₃—碱'],0,'酸、碱、盐的组成特征尚未稳定建立。','HCl 是酸，NaOH 是碱；NaCl 和 CaCO₃ 都由金属离子与酸根离子构成，属于盐。','基础'),

        common.q('综合推断','综合推断','第 7 周期第 1 族的元素是 <span class="chem">Fr</span>。它的最高正价是？',['+1','+2','−1','+7'],0,'元素位置已经给出，但未继续由族序数推出最高正价。','Fr 位于第 1 族，最外层 1 个电子，最高正价为 +1。'),

        common.q('周期规律','周期规律','某元素位于第 3 周期第 17 族。它有几个电子层？',['3 个','7 个','17 个','2 个'],0,'把周期数、族序数与电子层数混淆。','周期数等于电子层数，因此有 3 个电子层。'),
        common.q('最外层电子','最外层电子','第 3 周期第 17 族元素的最外层电子数是？',['7','3','1','17'],0,'没有用主族序数判断最外层电子数。','第 17 族主族元素的最外层有 7 个电子。'),
        common.q('最低负价','化合价','第 17 族元素的最低负价通常是？',['−1','−7','+1','+7'],0,'没有从“还差 1 个电子达到稳定结构”推出最低负价。','最外层 7 个电子，易得到 1 个电子，所以最低负价为 −1。'),
        common.q('最高正价','化合价','第 17 族元素（F 除外）的最高正价通常是？',['+7','+1','−1','+17'],0,'没有建立主族序数与最高正价之间的对应关系。','第 17 族元素（F 除外）的最高正价通常为 +7。'),
        common.q('最高价氧化物','酸推断','氯显 +7 价时，对应的最高价氧化物是？',['<span class="chem">Cl<sub>2</sub>O<sub>7</sub></span>','<span class="chem">Cl<sub>2</sub>O</span>','<span class="chem">ClO<sub>2</sub></span>','<span class="chem">HClO</span>'],0,'不能依据 Cl 的 +7 价与 O 的 −2 价配平氧化物。','2 个 Cl（总价 +14）与 7 个 O（总价 −14）组成 Cl₂O₇。'),
        common.q('酸推断','酸推断','由最高价氧化物 <span class="chem">Cl<sub>2</sub>O<sub>7</sub></span> 推断氯的最高价酸是？',['<span class="chem">HClO<sub>4</sub></span>','<span class="chem">HCl</span>','<span class="chem">HClO</span>','<span class="chem">HClO<sub>3</sub></span>'],0,'“最高正价 → 最高价氧化物 → 最高价酸”的推断链不完整。','Cl₂O₇ + H₂O → 2HClO₄，所以最高价酸是 HClO₄。'),

        common.q('酸推断','酸推断','硫的最高正价为 +6，对应的最高价酸是？',['<span class="chem">H<sub>2</sub>SO<sub>4</sub></span>','<span class="chem">H<sub>2</sub>SO<sub>3</sub></span>','<span class="chem">H<sub>2</sub>S</span>','<span class="chem">HNO<sub>3</sub></span>'],0,'不能由硫的最高正价识别其最高价含氧酸。','H₂SO₄ 中 H 为 +1、O 为 −2，可算得 S 为 +6。'),
        common.q('碱推断','碱推断','第 2 族元素 M 显 +2 价，它形成的碱通常写作？',['<span class="chem">M(OH)<sub>2</sub></span>','<span class="chem">MOH</span>','<span class="chem">M<sub>2</sub>OH</span>','<span class="chem">H<sub>2</sub>M</span>'],0,'化合价判断正确，但不能用电荷守恒写出碱的化学式。','M²⁺ 需要 2 个 OH⁻ 配平，得到 M(OH)₂。'),
        common.q('综合推断','综合推断','哪条推理链最完整、正确？',['第17族 → 7个最外层电子 → 最高正价+7（F除外）→ 最高价氧化物 → 最高价酸','第17族 → 17个电子层 → 最低负价−17','第1族 → 7个最外层电子 → 最高正价+7','第3周期 → 最外层一定有3个电子'],0,'周期、族、最外层电子与化合价之间的逻辑次序仍有混淆。','先由族判断最外层电子和价态，再由最高正价推最高价氧化物与最高价酸。')

    const state = { name: '', school: '', profile: '', card: 0, question: 0, selected: null, submitted: false, quizStart: 0, questionStart: 0, records: [] };
    const $ = (id) => document.getElementById(id);
    const strip = (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); };
    const profileName = () => state.profile === 'foundation' ? '基础强化方案' : '衔接进阶方案';
    function show(id) { document.querySelectorAll('.screen').forEach(x => x.classList.toggle('active', x.id === id)); window.scrollTo({top: 0, behavior: 'smooth'}); }

    $('start-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('student-name').value.trim();
      const school = $('student-school').value.trim();
      const chosen = document.querySelector('input[name="profile"]:checked');
      if (!name || !chosen) { $('form-error').textContent = !name ? '请先填写姓名。' : '请选择学习方案。'; return; }
      Object.assign(state, { name, school, profile: chosen.value, card: 0, question: 0, selected: null, submitted: false, records: [] });
      $('form-error').textContent = '';
      renderCard(); show('cards');
    });

    function renderCard() {
      const c = cards[state.card];
      $('study-card').innerHTML = `<span class="card-index">CARD ${state.card + 1}</span><h3>${c.title}</h3>${c.body}<p class="card-note">${c.note}</p>`;
      $('card-progress-label').textContent = `${state.card + 1} / ${cards.length}`;
      $('card-progress').style.width = `${(state.card + 1) / cards.length * 100}%`;
      $('card-prev').disabled = state.card === 0;
      $('card-next').textContent = state.card === cards.length - 1 ? '开始小测' : '下一张';
    }
    $('card-prev').addEventListener('click', () => { if (state.card > 0) { state.card--; renderCard(); } });
    $('card-next').addEventListener('click', () => {
      if (state.card < cards.length - 1) { state.card++; renderCard(); return; }
      state.quizStart = Date.now(); state.questionStart = Date.now(); renderQuestion(); show('quiz');
    });

    function renderQuestion() {
      const qs = banks[state.profile], q = qs[state.question];
      state.selected = null; state.submitted = false; state.questionStart = Date.now();
      $('question-tag').textContent = q.tag;
      $('question-count').textContent = `${q.area} · ${profileName()}`;
      $('question-text').innerHTML = q.prompt;
      $('quiz-progress-label').textContent = `第 ${state.question + 1} 题，共 ${qs.length} 题`;
      $('quiz-progress').style.width = `${state.question / qs.length * 100}%`;
      $('feedback').className = 'feedback'; $('feedback').innerHTML = '';
      $('quiz-action').disabled = true; $('quiz-action').textContent = '提交答案';
      $('options').innerHTML = q.options.map((opt, i) => `<label class="option" data-index="${i}"><input type="radio" name="answer" value="${i}"><span>${opt}</span></label>`).join('');
      document.querySelectorAll('.option').forEach(el => el.addEventListener('click', () => selectOption(Number(el.dataset.index))));
    }
    function selectOption(i) {
      if (state.submitted) return;
      state.selected = i;
      document.querySelectorAll('.option').forEach((el, idx) => { el.classList.toggle('selected', idx === i); el.querySelector('input').checked = idx === i; });
      $('quiz-action').disabled = false;
    }
    $('quiz-action').addEventListener('click', () => {
      const qs = banks[state.profile], q = qs[state.question];
      if (!state.submitted) {
        if (state.selected === null) return;
        state.submitted = true;
        const correct = state.selected === q.answer, now = Date.now();
        document.querySelectorAll('.option').forEach((el, idx) => { el.classList.remove('selected'); if (idx === q.answer) el.classList.add('correct'); if (!correct && idx === state.selected) el.classList.add('wrong'); });
        const fb = $('feedback'); fb.className = `feedback show ${correct ? 'ok' : 'bad'}`;
        fb.innerHTML = correct ? `<strong>判断正确</strong>${q.explain}` : `<strong>错误原因</strong>${q.diagnose}<br><span style="font-size:13px">正确思路：${q.explain}</span>`;
        state.records.push({
          studentName: state.name, studentType: state.profile, questionNumber: state.question + 1,
          question: strip(q.prompt), answer: strip(q.options[state.selected]), correctAnswer: strip(q.options[q.answer]),
          isCorrect: correct, answerTime: new Date(now).toISOString(), dwellMs: now - state.questionStart,
          errorTag: correct ? '' : q.tag, skill: q.skill, area: q.area, diagnosis: correct ? '' : q.diagnose
        });
        $('quiz-action').textContent = state.question === qs.length - 1 ? '查看诊断报告' : '下一题';
      } else {
        if (state.question < qs.length - 1) { state.question++; renderQuestion(); }
        else finishQuiz();
      }
    });

    function starHTML(rate) {
      const n = Math.max(1, Math.min(5, Math.round(rate * 5)));
      return `<span class="stars" aria-label="${n}星，共5星">${[0,1,2,3,4].map(i => `<span class="${i < n ? 'on' : ''}">★</span>`).join('')}</span>`;
    }
    function skillSummary(records) {
      const groups = {};
      records.forEach(r => { groups[r.skill] ||= { right: 0, total: 0 }; groups[r.skill].total++; if (r.isCorrect) groups[r.skill].right++; });
      return Object.entries(groups).map(([skill, v]) => ({ skill, rate: v.right / v.total, ...v })).sort((a,b) => a.rate - b.rate);
    }
    function adviceFor(skills) {
      const weak = skills.filter(s => s.rate < .7).slice(0, 3).map(s => s.skill);
      if (!weak.length) return '明日用 5 分钟复述“位置 → 电子结构 → 化合价 → 物质”的完整推理链，再做 2 道综合题保持熟练度。';
      const map = {
        '离子识别':'先用卡片区分 OH⁻、CO₃²⁻、SO₄²⁻、NO₃⁻、NH₄⁺，重点看元素组成和电荷。',
        '酸碱盐分类':'复习酸、碱、盐的组成特征，并把铵盐作为特殊盐单独对照。',
        '化学式理解':'用“正负电荷总数相等”练习离子配比，特别注意括号和下标。',
        '周期规律':'先补牢“周期数 = 电子层数”，不要把周期数与族序数混用。',
        '最外层电子':'用主族序数判断最外层电子数，再继续推断价态。',
        '化合价':'反复口述“族序数 → 最外层电子 → 最高正价 / 最低负价”。',
        '碱推断':'先写阳离子和 OH⁻ 的电荷，再按电荷守恒写出碱的化学式。',
        '酸推断':'分两步练：最高正价 → 最高价氧化物 → 最高价酸。',
        '铵根模型':'牢记 NH₄⁺ 是多原子阳离子，含 NH₄⁺ 的化合物可以是铵盐。',
        '一水合氨':'牢记 NH₃·H₂O 属于碱，判断依据是它在水中产生 OH⁻。',
        '综合推断':'把每一步依据写在箭头上，再完成从元素位置到酸或碱的综合推断。'
      };
      return weak.map(k => map[k] || `优先复习${k}。`).join(' ');
    }
    function finishQuiz() {
      const ended = Date.now(), total = state.records.length, right = state.records.filter(r => r.isCorrect).length;
      const session = { id: ended, studentName: state.name, studentSchool: state.school || '', studentType: state.profile, profileName: profileName(), startedAt: new Date(state.quizStart).toISOString(), completedAt: new Date(ended).toISOString(), durationMs: ended - state.quizStart, records: state.records };
      const saved = JSON.parse(localStorage.getItem('chemistryDiagnosticSessions') || '[]'); saved.push(session); localStorage.setItem('chemistryDiagnosticSessions', JSON.stringify(saved.slice(-30)));
      try { sessionStorage.setItem('chemistryDiagnosticLatest', JSON.stringify({ name: state.name, school: state.school || '', profile: state.profile, durationMs: session.durationMs, right, total, score: Math.round(right / total * 100), date: new Date().toISOString() })); } catch (_) {}
      document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.report === 'student'; t.classList.toggle('active', on); t.setAttribute('aria-selected', on); });
      document.querySelectorAll('.report-view').forEach(v => v.classList.toggle('active', v.id === 'student-report'));
      renderReport(session, right, total); show('report');
    }
    function formatTimeMs(ms) { const totalSec = Math.max(0, Math.floor(ms / 1000)); const m = Math.floor(totalSec / 60); const s = totalSec % 60; return `${m}分${s}秒`; }
    function moduleSummary(records) {
      const groups = {};
      records.forEach(r => { groups[r.area] ||= { right: 0, total: 0 }; groups[r.area].total++; if (r.isCorrect) groups[r.area].right++; });
      return Object.entries(groups).map(([area, v]) => ({ area, ...v }));
    }
    function recoverySkills(records) {
      const wrong = records.filter(r => !r.isCorrect);
      const skills = wrong.map(r => r.errorTag || r.skill).filter(Boolean);
      const unique = [...new Set(skills)].slice(0, 5);
      if (!unique.length) return [];
      return unique;
    }
    function generateTeacherFeedback(session, right, total) {
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const schoolDisplay = state.school || '未填写';
      const areas = [...new Set(session.records.map(r => r.area))];
      const trainingFocus = areas.join('、');
      const scorePct = Math.round(right / total * 100);
      const timeText = formatTimeMs(session.durationMs);
      const modules = moduleSummary(session.records);
      const moduleLines = modules.map(m => `- ${m.area}：${m.right}/${m.total}`).join('\n');
      const rSkills = recoverySkills(session.records);
      const skillLines = rSkills.length ? rSkills.map(s => `- ${s}`).join('\n') : '- 暂无，进入综合迁移训练';
      const mistakes = session.records.filter(r => !r.isCorrect);
      let mistakeLines = '';
      if (mistakes.length) {
        mistakeLines = mistakes.map((r, i) => {
          const stuAns = r.answer || '未作答';
          const nextAction = r.skill ? `请复习${r.skill}相关知识点，完成针对性练习。` : '请回顾本题涉及的核心概念。';
          return `${i+1}. [第${r.questionNumber}题] ${r.question}\n学生答案：${stuAns}\n正确答案：${r.correctAnswer}\n解析：${r.diagnosis || ''} ${nextAction}`;
        }).join('\n\n');
      } else {
        mistakeLines = '本轮无错题。';
      }
      const weakModules = modules.filter(m => m.right < m.total).map(m => m.area);
      let personalized = '';
      if (!weakModules.length) {
        personalized = `你已完成${profileName()}的全部诊断，各项表现稳定。建议进入更高难度的综合迁移训练，尝试将推断链应用到新的元素周期族中。`;
      } else {
        personalized = `根据${profileName()}的诊断结果，当前薄弱环节集中在${weakModules.join('、')}。建议优先回归知识卡片中对应的核心关系，完成概念梳理后再重新挑战相关题目。`;
      }
      const feedback = `甘老师化学｜初高衔接｜今日自适应小测
学生：${state.name}
学校/班级：${schoolDisplay}
日期：${dateStr}
训练重点：${trainingFocus}
第1轮：${right}/${total}（${scorePct}%），用时${timeText}
【模块表现】
${moduleLines}
【需回收技能】
${skillLines}
【错题明细】
${mistakeLines}
【个性化重点】${personalized}`;
      return feedback;
    }
    function copyTeacherFeedback() {
      const text = document.getElementById('teacher-feedback-text').textContent;
      if (!text) return;
      const done = () => { const btn = document.getElementById('copy-btn'); btn.textContent = '已复制'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '一键复制教师反馈'; btn.classList.remove('copied'); }, 2000); };
      const fail = () => { document.getElementById('copy-hint').className = 'copy-hint bad'; document.getElementById('copy-hint').textContent = '复制失败，请手动选中反馈框中的文本后 Ctrl+C 复制。'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { document.getElementById('copy-hint').className = 'copy-hint ok'; document.getElementById('copy-hint').textContent = '已复制到剪贴板'; done(); }).catch(fail);
        return;
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { document.getElementById('copy-hint').className = 'copy-hint ok'; document.getElementById('copy-hint').textContent = '已复制到剪贴板'; done(); } else fail();
      } catch (_) { fail(); }
    }
    function renderReport(session, right, total) {
      const timeText = formatTimeMs(session.durationMs);
      const score = Math.round(right / total * 100), skills = skillSummary(session.records), weak = skills.filter(s => s.rate < .7);
      $('report-title').textContent = `${state.name}，诊断完成`;
      $('report-subtitle').textContent = `${profileName()} · 用时 ${timeText} · 答对 ${right} / ${total} 题`;
      $('score-number').textContent = `${score}%`;
      const skillRows = skills.map(s => `<div class="skill-row"><span>${s.skill}</span>${starHTML(s.rate)}</div>`).join('');
      $('student-report').innerHTML = `<div class="report-grid"><section class="panel report-card"><h3>能力分析</h3><div class="skill-list">${skillRows}</div></section><section class="panel report-card"><h3>明日复习建议</h3><p class="advice">${adviceFor(skills)}</p></section></div>`;
      const mistakes = session.records.filter(r => !r.isCorrect);
      const weakItems = weak.length ? weak.slice(0,4).map((s, i) => `<li><strong>${s.skill}</strong>：正确 ${s.right}/${s.total}，说明相关推理还不稳定。</li>`).join('') : '<li>本次各项表现稳定，可增加综合推断题的难度。</li>';
      const detailHTML = mistakes.length ? mistakes.map(r => `<div class="mistake"><strong>第 ${r.questionNumber} 题 · ${r.errorTag}</strong><br>${r.diagnosis}<small>学生答案：${r.answer}　正确答案：${r.correctAnswer}　停留：${Math.round(r.dwellMs/1000)} 秒</small></div>`).join('') : '<p class="advice">本次没有错题。</p>';
      const firstPriority = weak[0]?.skill || '综合应用';
      const teacherFeedback = generateTeacherFeedback(session, right, total);
      $('teacher-report').innerHTML = `<div class="feedback-box-wrap"><div class="feedback-box-head"><h3>可复制的教师反馈</h3><button id="copy-btn" class="copy-btn" type="button" onclick="copyTeacherFeedback()">一键复制教师反馈</button></div><div id="teacher-feedback-text" class="feedback-box">${escapeHTML(teacherFeedback)}</div><div id="copy-hint" class="copy-hint">点击上方按钮即可复制纯文本反馈，可直接发送给教师。</div></div><div class="teacher-banner" style="margin-top:18px"><strong>${state.name} · 教师诊断</strong><br>本报告重点定位知识断点，不把总分作为唯一判断。建议先补：${firstPriority}。</div><div class="report-grid"><section class="panel report-card"><h3>主要薄弱点</h3><ol class="weak-list">${weakItems}</ol></section><section class="panel report-card"><h3>教学建议</h3><p class="advice">${adviceFor(skills)}</p></section></div><section class="panel report-card details"><h3>错题与停留时间</h3><details><summary>展开查看 ${mistakes.length} 道错题记录</summary>${detailHTML}</details></section>`;
      $('quiz-progress').style.width = '100%';
    }
    function escapeHTML(str) { const div = document.createElement('div'); div.appendChild(document.createTextNode(str)); return div.innerHTML; }

    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => { const on = t === tab; t.classList.toggle('active', on); t.setAttribute('aria-selected', on); });
      document.querySelectorAll('.report-view').forEach(v => v.classList.toggle('active', v.id === `${tab.dataset.report}-report`));
    }));
    $('restart').addEventListener('click', () => { $('student-name').value = ''; $('student-school').value = ''; document.querySelectorAll('input[name="profile"]').forEach(x => x.checked = false); show('home'); });
  </script>
</body>
</html>
